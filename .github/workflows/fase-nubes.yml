name: Sombra · fase de las nubes (GOES-19)
# Luis 27 nov 2026: registra en sombra la fase de la cima de las nubes (agua líquida / hielo), su altura y espesor sobre
# nuestros puntos públicos, para ver la lluvia de nube baja que el infrarrojo no ve y separar núcleo (hielo grueso) de
# yunque (hielo fino). Se cruzará con las estaciones del Inamhi. Solo registra en la rama fase-nubes; no cambia la página.
# Cada corrida completa las imágenes de las 3 últimas horas que falten (GitHub atrasa a veces los horarios).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      horas: { description: "Horas hacia atrás a completar (por defecto 3)", required: false }
permissions:
  contents: write
concurrency:
  group: fase-nubes
  cancel-in-progress: false
jobs:
  fase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "numpy<3" "h5netcdf>=1.3,<2" "h5py>=3.10,<4" "fsspec>=2024.6" "aiohttp>=3.9,<4"
      - name: Rama de datos
        run: |
          if git ls-remote --exit-code --heads origin fase-nubes >/dev/null; then
            git clone -q --depth 1 --branch fase-nubes "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" datos
          else
            mkdir datos && cd datos && git init -q -b fase-nubes \
              && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          fi
      - name: Leer GOES-19
        env: { HORAS: "${{ github.event.inputs.horas || '3' }}", DIR_SALIDA: "datos/registro/fase_nubes" }
        run: python3 scripts/fase_nubes.py
      - name: Guardar
        working-directory: datos
        run: |
          git config user.name "datalab-robot"
          git config user.email "datalab-robot@users.noreply.github.com"
          git add registro
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -q -m "fase de nubes $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git push -q origin fase-nubes && exit 0; sleep 10; git pull --rebase -q origin fase-nubes || true; done
          exit 1
