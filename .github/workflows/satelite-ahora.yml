# Señales del satélite cada 10 min para los puntos ciegos de la lluvia de datalabecuador.com/clima (Luis, 9 nov).
# Guarda solo salida/ahora.json en la rama "satelite" (un único commit, se reemplaza cada vez): NO toca main ni Pages.
# 9 nov: GitHub atrasa los cron cortos (en la práctica corría ~1 vez por hora → "dato viejo"). Ahora cada corrida es un
# BUCLE de ~5 h 40 min que procesa cada 10 min (repo público: minutos gratis); el cron solo la reanima si se cae.
name: Satélite cada 10 min (lluvia en puntos ciegos)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: satelite-ahora, cancel-in-progress: false }   # si ya hay un bucle corriendo, el nuevo espera
jobs:
  satelite:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/satelite_ahora.py
            scripts/avisos_lab.py
            scripts/puntos_satelite.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy h5py requests
      - name: Bucle cada 10 min (~5 h 40 min)
        run: |
          fin=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $fin ]; do
            t0=$(date +%s)
            if timeout 420 python scripts/satelite_ahora.py; then
              rm -rf /tmp/pub && mkdir /tmp/pub && cp salida/ahora.json salida/historia.json /tmp/pub/ && { cp salida/avisos_lab.json /tmp/pub/ 2>/dev/null || true; }
              ( cd /tmp/pub && git init -q && git checkout -q -b satelite \
                && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" add ahora.json historia.json $(test -f avisos_lab.json && echo avisos_lab.json) \
                && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" commit -q -m "satélite $(date -u +%H:%M)" \
                && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" satelite ) \
                || echo "no se pudo publicar esta vuelta"
            else
              echo "vuelta fallida $(date -u +%H:%M)"
            fi
            espera=$(( 600 - ($(date +%s) - t0) )); [ $espera -gt 0 ] && sleep $espera
          done
