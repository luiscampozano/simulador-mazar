# Señales del satélite cada 10 min para los puntos ciegos de la lluvia de datalabecuador.com/clima (Luis, 9 nov).
# Guarda solo salida/ahora.json en la rama "satelite" (un único commit, se reemplaza cada vez): NO toca main ni Pages.
# 9 nov: GitHub atrasa los cron cortos (en la práctica corría ~1 vez por hora → "dato viejo"). Ahora cada corrida es un
# BUCLE de ~5 h 40 min que procesa cada 10 min (repo público: minutos gratis); el cron solo la reanima si se cae.
name: Satélite cada 10 min (lluvia en puntos ciegos)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: satelite-ahora, cancel-in-progress: false }   # si ya hay un bucle corriendo, el nuevo espera
jobs:
  satelite:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/satelite_ahora.py
            scripts/avisos_lab.py
            scripts/puntos_satelite.json
            scripts/nowcast_sombra.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy h5py requests
      # 13 nov (Luis): nowcast en SOMBRA con pysteps (no cambia avisos ni página). Si no instala, el robot sigue igual.
      - name: pysteps para el nowcast en sombra (entorno aparte, no toca el numpy del robot)
        run: timeout 300 bash -c "python -m venv /tmp/ps && /tmp/ps/bin/pip install -q pysteps opencv-python-headless requests" || { rm -rf /tmp/ps; echo "pysteps no se instalo, sin nowcast en sombra"; }
      - name: Bucle cada 10 min (~5 h 40 min)
        run: |
          fin=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $fin ]; do
            t0=$(date +%s)
            if timeout 420 python scripts/satelite_ahora.py; then
              rm -f salida/nowcast_sombra.json
              [ -x /tmp/ps/bin/python ] && { timeout 90 /tmp/ps/bin/python scripts/nowcast_sombra.py || echo "nowcast sombra: saltado"; }
              rm -rf /tmp/pub && mkdir /tmp/pub && cp salida/ahora.json salida/historia.json /tmp/pub/ && { cp salida/avisos_lab.json salida/lluvia3d.json /tmp/pub/ 2>/dev/null || true; } && { cp salida/nowcast_sombra.json /tmp/pub/ 2>/dev/null || true; } && { cp salida/nowcast_sombra_hist.json /tmp/pub/ 2>/dev/null || true; }
              ( cd /tmp/pub && git init -q && git checkout -q -b satelite \
                && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" add ahora.json historia.json $(test -f avisos_lab.json && echo avisos_lab.json) $(test -f lluvia3d.json && echo lluvia3d.json) $(test -f nowcast_sombra.json && echo nowcast_sombra.json) $(test -f nowcast_sombra_hist.json && echo nowcast_sombra_hist.json) \
                && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" commit -q -m "satélite $(date -u +%H:%M)" \
                && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" satelite ) \
                || echo "no se pudo publicar esta vuelta"
            else
              echo "vuelta fallida $(date -u +%H:%M)"
            fi
            # 13 nov (Luis): sincronizado con el GOES. La imagen que empieza a las :X0 termina ~:X9:30 y aparece en AWS ~:X0:30–:X1;
            # la vuelta arranca a las :X2 (UTC) para tomarla apenas sale (antes podía llegar justo antes y publicar la anterior:
            # retraso de 20–30 min; ahora ~12–15 min). Si una vuelta se alarga, espera al siguiente :X2.
            espera=$(( (720 - $(date +%s) % 600) % 600 )); if [ $espera -lt 20 ]; then espera=$(( espera + 600 )); fi; if [ $(( $(date +%s) + espera )) -ge $fin ]; then break; fi; sleep $espera
          done
