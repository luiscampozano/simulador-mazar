# Serie R: ERA5 diario en puntos fijos, 1981–hoy, en la rama serie-r.
#  - puntos: superficie por punto (series de tiempo del CDS, rápido).
#  - rejilla s / p: CAPE y niveles de presión en pedazos (la cola general del CDS es lenta); cada pedazo se guarda apenas
#    llega y la próxima corrida retoma lo que falte. Corre cada 6 h hasta completar, y a mano.
name: Serie R
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency: { group: serie-r, cancel-in-progress: false }
jobs:
  mjo:   # índice RMM de la MJO (Bureau of Meteorology de Australia, desde 1974)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: serie-r, path: _serie_r }
      - working-directory: _serie_r
        run: |
          curl -sfL -A "Mozilla/5.0" -o /tmp/mjo.txt "http://www.bom.gov.au/climate/mjo/graphics/rmm.74toRealtime.txt"
          test $(wc -l < /tmp/mjo.txt) -gt 15000
          git config user.name "datalab-robot" && git config user.email "datalab-robot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin serie-r && git reset -q --hard origin/serie-r
            mkdir -p r && cp /tmp/mjo.txt r/mjo.txt
            git add r/mjo.txt && git commit -q -m "Serie R: MJO [skip ci]" || exit 0
            git push -q origin HEAD:serie-r && exit 0; sleep $((RANDOM % 20 + 5))
          done
          exit 1
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        parte: ["puntos", "rejilla s 320", "rejilla p 320"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: serie-r, path: _serie_r }
      - run: python3 -m pip install --quiet ecmwf-datastores-client xarray netCDF4 numpy pandas numcodecs
      - env: { CDS_API_KEY: "${{ secrets.CDS_API_KEY }}", SERIE_DATOS: "${{ github.workspace }}/_serie_r" }
        run: |
          git -C _serie_r config user.name "datalab-robot" && git -C _serie_r config user.email "datalab-robot@users.noreply.github.com"
          python3 scripts/serie_r.py ${{ matrix.parte }}
