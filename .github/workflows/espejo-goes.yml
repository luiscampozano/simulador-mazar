# Espejo de imágenes GOES-19 recortadas a Ecuador (Luis, 15 nov): las baja GRATIS este repo público y el repo privado
# las lee de aquí en vez de bajarlas de la NOAA (ahorra ~1.000 min/mes). Si el espejo falla o se atrasa, el privado
# las baja de la NOAA como antes: nunca se queda sin datos. Bucle aparte: NO toca el robot del satélite.
name: Espejo GOES cada 10 min
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: espejo-goes, cancel-in-progress: false }   # si ya hay un bucle corriendo, el nuevo espera
jobs:
  espejo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/espejo_goes.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy h5py requests fsspec aiohttp
      - name: Bucle cada 10 min (~5 h 40 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fin=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $fin ]; do
            timeout 480 python scripts/espejo_goes.py || echo "vuelta fallida $(date -u +%H:%M)"
            # a los :X5 (UTC): la imagen que empieza a las :X0 ya está en AWS; las de nubes salen unos minutos después
            espera=$(( (900 - $(date +%s) % 600) % 600 )); if [ $espera -lt 20 ]; then espera=$(( espera + 600 )); fi
            if [ $(( $(date +%s) + espera )) -ge $fin ]; then break; fi; sleep $espera
          done
