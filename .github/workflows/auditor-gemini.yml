# Segundo auditor: Gemini propone hasta 3 candidatos al día para el laboratorio (envía 10:23 en Ecuador, modo lote; recoge 10:23/12:23/13:53). Tope de gasto: scripts/gasto_gemini.py.
# La propuesta pasa por validación (código puro, sin archivos ni red) y prueba con los datos de hoy; si pasa, queda en una
# rama candidato/gemini-<fecha>-<id>. Claude (auditor 14:36) la revisa con un Claude independiente y decide. Nunca toca el titular.
name: Auditor Gemini (propone candidatos)
on:
  schedule:
    - cron: "23 15 * * *"   # 10:23 Ecuador: recoge el lote pendiente y envía el de hoy
    - cron: "23 17 * * *"   # 12:23: recoge si ya está listo
    - cron: "53 18 * * *"   # 13:53: recoge antes del auditor Claude de las 14:36
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: auditor-gemini, cancel-in-progress: false }
jobs:
  proponer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gemini propone
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python3 scripts/auditor_gemini.py --lote   # Luis 23 nov (opción 2): modo lote, mitad de precio
      - name: Guardar propuesta (y rama si pasó la prueba)
        run: |
          git config user.name "datalab-robot" && git config user.email "datalab-robot@users.noreply.github.com"
          if [ -f .rama_candidato ]; then
            R=$(cat .rama_candidato); rm .rama_candidato
            if git ls-remote --exit-code -q origin "refs/heads/$R" >/dev/null; then R="$R-$(TZ=America/Guayaquil date +%H%M)"; fi
            git checkout -q -b "$R"
            git add scripts/laboratorio.py laboratorio/propuestas
            git commit -q -m "Gemini propone candidato ($R) [skip ci]"
            git push -q origin "$R"
            git checkout -q main
            git checkout "$R" -- laboratorio/propuestas
          fi
          git add -A laboratorio
          git commit -q -m "Auditor Gemini (lote) $(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M') [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
