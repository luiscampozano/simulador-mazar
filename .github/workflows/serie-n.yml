# Serie N: reanálisis NCEP/NCAR R1 diario (NOAA PSL), 1981–hoy, caja del Pacífico ecuatorial oriental. A mano.
name: Serie N
on:
  workflow_dispatch:
    inputs:
      anios: { description: "Años separados por coma (vacío = los que falten desde 1981)", required: false, default: "" }
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-latest
    outputs: { anios: "${{ steps.a.outputs.anios }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: serie-r }
      - id: a
        env: { PEDIDO: "${{ inputs.anios }}" }
        run: |
          python3 - >> $GITHUB_OUTPUT <<'PY'
          import datetime, json, os
          p = os.environ.get("PEDIDO", "").strip()
          if p: a = [int(x) for x in p.split(",")]
          else:
              hoy = datetime.date.today().year
              a = [x for x in range(1981, hoy + 1) if x == hoy or not os.path.exists(f"r/n{x}.nc")]
          print("anios=" + json.dumps(a))
          PY
  bajar:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        anio: ${{ fromJSON(needs.lista.outputs.anios) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet xarray netCDF4 numpy
      - run: python3 scripts/serie_n.py ${{ matrix.anio }} /tmp/n${{ matrix.anio }}.nc
      - uses: actions/checkout@v4
        with: { ref: serie-r, path: _serie_r }
      - working-directory: _serie_r
        run: |
          git config user.name "datalab-robot" && git config user.email "datalab-robot@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin serie-r && git reset -q --hard origin/serie-r
            mkdir -p r && cp /tmp/n${{ matrix.anio }}.nc r/
            git add r/n${{ matrix.anio }}.nc && git commit -q -m "Serie N ${{ matrix.anio }} [skip ci]" || exit 0
            git push -q origin HEAD:serie-r && exit 0; sleep $((RANDOM % 25 + 5))
          done
          exit 1
