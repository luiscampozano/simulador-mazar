name: Robot del simulador y publicación

on:
  schedule:
    # respaldo cada 2 horas (minuto 17, UTC). Desde el 10 nov (Luis) el "Reloj del robot" lo dispara CADA HORA al minuto
    # 12, porque GitHub atrasa los cron; si el reloj se cae, este respaldo mantiene al menos una corrida cada 2 h.
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre la última versión (incluye los datos que acaba de subir el robot)

      - name: Calibrar el modelo con el historial (una vez al día)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/calibrar.py

      - name: Leer Celec Sur, Cenace y Open-Meteo
        if: github.event_name != 'push'
        run: python3 scripts/robot.py

      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git add datos.json serie_cenace.json parametros_modelo.json historial registro laboratorio
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git config user.name "robot-simulador"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            COTA=$(python3 -c "import json;print(json.load(open('datos.json'))['cota'])")
            git commit -m "Robot: cota ${COTA} msnm y datos de Cenace/Open-Meteo"
            if git pull --rebase origin main; then
              git push
            else
              git rebase --abort
              git reset --hard origin/main
              echo "Otro cambio llegó al mismo tiempo; se reintenta en la próxima corrida"
            fi
          fi

      - uses: actions/configure-pages@v5
      # 6 nov: se publica una copia sin historial/smec (13 MB que la página no usa; desde que entró, Pages se quedaba
      # "syncing_files" hasta el tiempo límite) ni .git/.github
      - name: Preparar lo que se publica
        run: rsync -a --exclude .git --exclude .github --exclude historial/smec --exclude _publicar ./ _publicar/ && du -sh _publicar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publicar
      # 6 nov (Luis): si GitHub Pages se queda colgado, se espera unos minutos y se reintenta (hasta 2 veces más)
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 420000
      - if: steps.deploy.outcome == 'failure'
        run: echo "Pages no respondió; se reintenta en 3 minutos" && sleep 180
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 420000
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "Pages sigue sin responder; último intento en 5 minutos" && sleep 300
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 420000
