# DataLab Ec · 3 videos diarios (15 nov: + "Mazar en 3D": el nivel día a día y por qué se movió) (Luis, 15 nov): "las tormentas del día" (satélite cada 10 min con los números de las
# tormentas, Remotion) y "lluvia del día 3D" (la vista pública /3d/acumulada/ hora a hora con la cámara girando).
# Del día calendario de AYER. Quedan en la rama "videos" (un solo commit que se reemplaza): NO se publican en redes.
name: Videos diarios
on:
  schedule:
    - cron: "50 11 * * *"   # 06:50 en Ecuador (después de la bitácora de las 06:25 que publica la lluvia del día 3D)
    - cron: "30 12 * * *"   # 07:30 · respaldos (Luis 16 nov): GitHub atrasa a veces el de las 06:50; si los 3 videos
    - cron: "30 13 * * *"   # 08:30   del día ya están en la rama "videos", la corrida termina sin hacer nada
  workflow_dispatch:
    inputs:
      dia:
        description: "Día AAAA-MM-DD (vacío = ayer)"
        required: false
permissions:
  contents: write
concurrency: { group: videos-diarios, cancel-in-progress: false }
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # 15 nov: 3 videos (25 + 40 + 25 min en el peor caso)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/satelite_ahora.py
            scripts/videos
            datos.json
            serie_cenace.json
            historial/celec_diario.json
            historial/celec_2010_2022.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Herramientas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter fonts-noto-color-emoji ffmpeg > /dev/null
          pip install -q numpy h5py requests pillow
      - name: Día
        env: { ENTRADA: "${{ github.event.inputs.dia }}" }
        run: |
          D="${ENTRADA:-$(TZ=America/Guayaquil date -d yesterday +%F)}"
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "día inválido: $D"; exit 1; }
          echo "DIA=$D" >> "$GITHUB_ENV"
          R="https://raw.githubusercontent.com/${{ github.repository }}/videos"
          if [ -z "$ENTRADA" ] && curl -sfI "$R/tormentas_$D.mp4" >/dev/null && curl -sfI "$R/lluvia3d_$D.mp4" >/dev/null && curl -sfI "$R/mazar_$D.mp4" >/dev/null; then
            echo "HECHO=1" >> "$GITHUB_ENV"; echo "los 3 videos de $D ya están: no se repite"
          fi
      - name: Video 1 · tormentas del día
        if: env.HECHO != '1'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p salida_videos
          python scripts/videos/cuadros.py scripts/videos/tormentas "$DIA"
          cd scripts/videos/tormentas && npm install --no-audit --no-fund --loglevel=error
          npx remotion render src/index.jsx Tormentas "$GITHUB_WORKSPACE/salida_videos/tormentas_$DIA.tmp.mp4" --concurrency=2 --log=error
          mv "$GITHUB_WORKSPACE/salida_videos/tormentas_$DIA.tmp.mp4" "$GITHUB_WORKSPACE/salida_videos/tormentas_$DIA.mp4"
      - name: Video 2 · lluvia del día 3D
        if: env.HECHO != '1'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          cd scripts/videos && npm install --no-audit --no-fund --loglevel=error --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          for i in 1 2 3 4; do   # si la bitácora de las 06:25 se atrasó, la página aún muestra otro día: esperar y reintentar
            node video_3d.js "$GITHUB_WORKSPACE/salida_videos" && exit 0
            echo "reintento $i en 5 min"; sleep 300
          done
          exit 1
      - name: Video 3 · Mazar en 3D
        if: env.HECHO != '1'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          cd scripts/videos && { [ -d node_modules/playwright ] || npm install --no-audit --no-fund --loglevel=error --no-save playwright@1.48.2; } && npx playwright install --with-deps chromium
          RAIZ="$GITHUB_WORKSPACE" node video_mazar.js "$GITHUB_WORKSPACE/salida_videos"
      - name: Guardar en la rama "videos"
        if: env.HECHO != '1'
        run: |
          ls -l salida_videos || true
          ls salida_videos/*.mp4 > /dev/null 2>&1 || { echo "no salió ningún video"; exit 1; }
          rm -rf /tmp/v && mkdir /tmp/v && cp salida_videos/*.mp4 /tmp/v/
          printf "Videos de DataLab Ec del %s (los genera el robot cada mañana; no se publican solos).\n" "$DIA" > /tmp/v/LEEME.txt
          cd /tmp/v && git init -q && git checkout -q -b videos \
            && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" add . \
            && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" commit -q -m "videos $DIA" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" videos
