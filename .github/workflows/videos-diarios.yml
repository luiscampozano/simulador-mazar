# DataLab Ec · 2 videos diarios (Luis, 15 nov): "las tormentas del día" (satélite cada 10 min con los números de las
# tormentas, Remotion) y "lluvia del día 3D" (la vista pública /3d/acumulada/ hora a hora con la cámara girando).
# Del día calendario de AYER. Quedan en la rama "videos" (un solo commit que se reemplaza): NO se publican en redes.
name: Videos diarios
on:
  schedule:
    - cron: "50 11 * * *"   # 06:50 en Ecuador (después de la bitácora de las 06:25 que publica la lluvia del día 3D)
  workflow_dispatch:
    inputs:
      dia:
        description: "Día AAAA-MM-DD (vacío = ayer)"
        required: false
permissions:
  contents: write
concurrency: { group: videos-diarios, cancel-in-progress: false }
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/satelite_ahora.py
            scripts/videos
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Herramientas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter ffmpeg > /dev/null
          pip install -q numpy h5py requests pillow
      - name: Día
        run: echo "DIA=${{ github.event.inputs.dia }}" | sed "s/=$/=$(TZ=America/Guayaquil date -d yesterday +%F)/" >> "$GITHUB_ENV"
      - name: Video 1 · tormentas del día
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p salida_videos
          python scripts/videos/cuadros.py scripts/videos/tormentas "$DIA"
          cd scripts/videos/tormentas && npm install --no-audit --no-fund --loglevel=error
          npx remotion render src/index.jsx Tormentas "$GITHUB_WORKSPACE/salida_videos/tormentas_$DIA.tmp.mp4" --concurrency=2 --log=error
          mv "$GITHUB_WORKSPACE/salida_videos/tormentas_$DIA.tmp.mp4" "$GITHUB_WORKSPACE/salida_videos/tormentas_$DIA.mp4"
      - name: Video 2 · lluvia del día 3D
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cd scripts/videos && npm install --no-audit --no-fund --loglevel=error --no-save playwright@1.48.2 && npx playwright install chromium
          node video_3d.js "$GITHUB_WORKSPACE/salida_videos"
      - name: Guardar en la rama "videos"
        run: |
          ls -l salida_videos || true
          ls salida_videos/*.mp4 > /dev/null 2>&1 || { echo "no salió ningún video"; exit 1; }
          rm -rf /tmp/v && mkdir /tmp/v && cp salida_videos/*.mp4 /tmp/v/
          printf "Videos de DataLab Ec del %s (los genera el robot cada mañana; no se publican solos).\n" "$DIA" > /tmp/v/LEEME.txt
          cd /tmp/v && git init -q && git checkout -q -b videos \
            && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" add . \
            && git -c user.name="datalab-robot" -c user.email="datalab-robot@users.noreply.github.com" commit -q -m "videos $DIA" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" videos
